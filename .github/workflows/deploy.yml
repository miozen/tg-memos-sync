# [Category B] CI/CD Pipeline Definition: Handles automated deployment to Cloudflare
name: Deploy Worker
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # [Category A] Upgrade checkout action to v4 for Node.js compatibility
      - uses: actions/checkout@v4 
      
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          # [Category B] Secret mapping: Injects GitHub secrets into Worker environment
          secrets: |
            TELEGRAM_TOKEN
            MEMOS_TOKEN
            MEMOS_BASE_URL
            CHANNEL_ID_PUBLIC
            CHANNEL_ID_PRIVATE
            SECRET_PATH
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MEMOS_TOKEN: ${{ secrets.MEMOS_TOKEN }}
          MEMOS_BASE_URL: ${{ secrets.MEMOS_BASE_URL }}
          CHANNEL_ID_PUBLIC: ${{ secrets.CHANNEL_ID_PUBLIC }}
          CHANNEL_ID_PRIVATE: ${{ secrets.CHANNEL_ID_PRIVATE }}
          SECRET_PATH: ${{ secrets.SECRET_PATH }}
